<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Игра Быки и коровы">
  <title>Быки и коровы</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Быки и коровы</h1>
    <p class="rules">Угадайте четырёхзначное число. Все цифры в нём разные.</p>

    <form id="guess-form">
      <label for="guess-input">Ваш вариант</label>
      <div class="controls">
        <input
          id="guess-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          placeholder="123456"
        >
        <button type="submit">Проверить</button>
      </div>
    </form>

    <p class="message" id="message" aria-live="polite"></p>

    <div class="game-info">
      <h2>История</h2>
      <p>Попыток: <span id="attempt-count">0</span></p>
    </div>

    <ol class="history" id="history"></ol>
    <p class="empty-history" id="empty-history">Попыток пока нет.</p>

    <button class="new-game-button" id="new-game-button" type="button">Новая игра</button>
  </main>
</body>
</html>
