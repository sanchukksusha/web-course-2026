<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Классическая игра Змейка">
  <title>Змейка</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Змейка</h1>
    <p class="rules">Управляйте змейкой стрелками и собирайте яблоки.</p>

    <div class="game-info">
      <p>Счёт: <strong id="score">0</strong></p>
      <p id="message" aria-live="polite">Нажмите «Начать игру».</p>
    </div>

    <canvas id="game-canvas" width="200" height="200" aria-label="Игровое поле"></canvas>

    <button class="start-button" id="start-button" type="button">Начать игру</button>
  </main>
</body>
</html>
